name: Secret protection
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install checksum-verified scanner
        run: python3 scripts/install-secret-scanner.py
      - name: Test protection rules
        run: python3 scripts/test-secret-protection.py
      - name: Check filenames and complete Git history
        run: python3 scripts/check-secrets.py history
